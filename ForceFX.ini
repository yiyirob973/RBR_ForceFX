[ForceFX]
; RBR_ForceFX configuration
; Settings can be changed in the RBR menu at Plugins > ForceFX or edited here.
; Menu changes are saved to this file. Manual edits take effect when RBR starts.
;
; Effect strengths use DirectInput magnitude units. The plugin clamps settings
; to their supported ranges and enforces a hard limit on combined output.

; Connection and telemetry
; Where telemetry comes from. NGP needs UDP telemetry switched on, but it can send to any
; port, including one that SimHub or another tool already uses.
;   0 = Auto (default): read NGP's packets as it sends them, and also listen on UdpPort as a backup.
;   1 = Hook only: read NGP's packets as it sends them and never open a port.
;   2 = UDP only: don't hook anything; listen on UdpPort. NGP must send to that port.
TelemetrySource=0
; Backup UDP port, used when TelemetrySource is 0 or 2. Set it to 0 to never open a port.
; You only need to point NGP at it if the hook can't see NGP's packets on your setup.
; Choose a port that no other application uses.
UdpPort=6778
; Minimum accepted telemetry packet size in bytes. Change only if required by
; a compatible telemetry format.
MinPacketBytes=664
; DirectInput wheel device name. Select a device from the in-game Wheel menu;
; the selected name is saved here.
Wheel=
; 1 = connect to the configured wheel at startup; 0 = connect from the menu.
AutoConnect=0

; Effect switches (1 = on, 0 = off). Also available at the top of the in-game menu;
; useful for diagnosing how each effect feels on its own.
EnableEngine=1
EnableRoad=1
EnableBrake=1
EnableLandingBoost=1
; Gives gravel, snow, ice and grass their own road feel (see SurfaceStrength and the [Surface] section
; at the end of this file). It needs EnableRoad=1. At 0 the road feels the same on every surface.
EnableSurfaceFeel=1
; Dynamic surface audio: tyre and ground sounds for each wheel. Off by default. Needs sound files in
; Plugins\ForceFXAudio\sounds and the settings in ForceFXAudio.ini. Also the first switch in the in-game menu.
; Tuning aid: 1 = write ForceFX_probe.csv (ground ids and road signals, ten times a second). For finding how a surface
; such as cobblestone differs from tarmac in the telemetry. Off normally; read when RBR starts.
SurfaceProbe=0
EnableDynamicAudio=0
; Live multipliers for the dynamic audio, also in the menu (1 = as set in ForceFXAudio.ini).
AudioDebrisLevel=1
AudioImpactLevel=1
AudioSuspensionLevel=1

; Effect levels and mixing
; Maximum engine vibration strength. Engine feedback has the lowest priority.
EngineMaxMagnitude=1200
; Maximum combined road, surface, and bump feedback strength.
RoadMaxMagnitude=3000
; Maximum braking judder and front-wheel lock-up feedback strength.
BrakeMaxMagnitude=2000
; Combined output limit for all effect layers. Lower this if feedback feels too
; strong or to use a more conservative output level. Hard limit: 5000.
TotalMaxMagnitude=4000
; Strength of priority mixing, from 0 to 1. Road takes priority over engine.
; Set to 0 to disable priority-based reduction.
PriorityDuck=0.85

; Landing and impact feedback
; Landing sensitivity: 0 disables landing feedback; higher values increase it
; (0 to 3). At 1.5 or more, even moderate landings reach full strength.
ImpactGain=0.7
; Landing boost: when a landing or hard hit is detected, RBR's OWN steering force is
; scaled up for a fraction of a second (no separate effect is added on top).
; Extra torque at the peak of a full-severity landing, as a multiple of RBR's current
; force: 0 = off, 2 = +200% (three times RBR's force), 4 = +400%.
LandingBoost=1.1
; Minimum extra push in the direction RBR is already pushing, as a share of full
; torque (0 to 1). Helps when RBR's own force happens to be small at touchdown.
LandingMinPush=0.15
; Sensitivity threshold for detected impacts without airtime. Increase this if
; normal weight transfer triggers impact feedback; decrease it if hard hits are
; missed. Real airtime landings are not affected by this threshold.
LandingThreshold=3
; Fraction of the car's static tyre load below which it is considered airborne.
; Adjust to tune detection of smaller jumps versus bumps.
LandingAirLevel=0.2
; Strength of the compression thump added during landings and heavy compression.
ThumpGain=1.4

; Braking feedback
; Braking judder pitch multiplier. 1 = default.
BrakeHzScale=1
; Front-wheel lock-up detection threshold. Lower values trigger feedback sooner.
LockThreshold=0.12
; Initial tyre circumference estimate in metres, used until measured from
; telemetry while coasting.
TyreCircumference=1.95

; Engine feedback
; Engine cylinder count, used to calculate the vibration pulse rate.
Cylinders=4
; Engine vibration frequency range in Hz. Frequency follows engine speed.
EngineMinHz=14
EngineMaxHz=100
; Assumed rev limit when telemetry does not provide one. 0 = estimate it from
; telemetry, starting with RpmMaxInit.
RpmMax=0
RpmMaxInit=7500
; High-rev engine texture (0 = smoother, 1 = rougher and more irregular).
EngineGrit=0.5
; Strength of the low-speed idle pulse.
LumpScale=1
; Uneven engine firing amount (0 = even firing; higher values add variation).
Unevenness=0

; Road and suspension feedback
; Road vibration frequency range in Hz. Feedback pitch varies with speed and
; detected surface roughness.
RoadMinHz=25
RoadMaxHz=100
; Speed in metres per second at which speed-dependent effects reach full scale.
MaxSpeed=40
; Tyre-roughness range mapped to road feedback. RoughGamma shapes the response
; curve: 1 = linear; higher values make feedback build up later.
RoughLow=0.03
RoughHigh=0.35
RoughGamma=1.0
; How much damper speed adds to road feedback, for hard hits and kerbs. 1 = default.
PistonScale=1
; Road texture coarseness: 0 = smoother vibration; 1 = coarser, more irregular.
RoadGrain=0.9
; How strongly the ground type reshapes the road feel. 0 = no change at all, 1 = as tuned in the
; [Surface] section, above 1 = bolder. Only used while EnableSurfaceFeel=1.
SurfaceStrength=1
; Left/right separation: 0 = similar feedback on both sides; 1 = fully
; independent side feedback.
RoadDirectional=0.7
; Set to 1 to flip the left/right direction of road impacts. Try it if bumps feel mirrored on your wheel.
RoadSideInvert=0
; Influence of tyre load on left/right road feedback. 0 = ignore load difference.
LoadInfluence=0.6
; Contribution of vertical acceleration to road bump feedback.
BumpScale=0.25
; Amount road and engine feedback fade while the car is airborne (0 = no fade,
; 1 = fade out fully).
AirborneFade=1
; Overall vehicle weight feel. Higher values produce a heavier thump, slower
; decay, and lower road/landing pitch. A car profile may override this value.
WeightFeel=1.2
; 1 = apply per-car settings from ForceFXCars.ini; 0 = use these settings only.
CarProfiles=1

; Output protection
; How much sustained vibration ForceFX will push into the wheel before it gradually
; backs off to protect the hardware. Lower values are more conservative.
SustainedLimit=0.1

; Live level and hotkeys
; Overall live level, from 0 to 1. It scales effects down from their configured
; levels and can never raise output above your limits. The in-game menu and the
; hotkeys change it, and the value is saved here.
UserGain=1
; Per-press multiplier for the live-level increase/decrease hotkeys.
GainRatio=0.85
; Hotkey values are decimal Windows virtual-key codes (107 = Numpad +, 109 = Numpad -,
; 106 = Numpad *); 0 disables a hotkey. The hotkeys only work while RBR is the foreground window.
KeyGainUp=107
KeyGainDown=109
; Hotkey for muting or restoring the added ForceFX effects.
KeyMute=106
; Modifier key required with the hotkeys: 0 = none, 17 = Ctrl, 16 = Shift,
; 18 = Alt.
KeyModifier=0
; 1 = play a beep when the live level changes.
GainBeep=1

; Advanced telemetry layout
; Byte offsets used to read values from NGP telemetry packets. You should only need
; to change these if your setup sends a different packet layout.
; Values are 32-bit floats unless otherwise noted.
OffsetCarIndex=56
OffsetThrottle=28
OffsetBrake=32
OffsetSpeed=60
OffsetAccHeave=120
OffsetRpm=136
; Rev-limit offset; -1 means the packet does not contain a rev limit.
OffsetRpmMax=-1
; Start of the suspension data and the byte size of each wheel entry.
OffsetSuspBase=152
SuspStride=128
; Offsets within each wheel entry for strut force, damper velocity, and tyre
; surface segment (the surface segment is a 32-bit integer).
OffsetStrutForce=16
OffsetPistonVel=28
OffsetTyreSegment=60
; 1 = telemetry speed is in km/h; 0 = speed is in metres per second.
SpeedIsKph=0
; Scale factor applied to telemetry engine RPM.
RpmScale=1

[Surface]
; Surface feel: the plugin reads which ground is under the tyres (read-only, from RBR's own contact data)
; and reshapes the road vibration for it. The switch and the overall strength are EnableSurfaceFeel and
; SurfaceStrength above (also in the in-game menu). Everything below is for tuning one surface at a time.
; Edits here take effect when RBR starts.
;
; Each tyre is read separately (front left, front right, rear left, rear right). TyreOrder says which wheel
; each tyre object is, in the order the plugin finds them in memory. Measured on test drives: rear pair first, then
; the front pair, each left then right. If left and right feel swapped, try RR,RL,FR,FL.
TyreOrder=RL,RR,FL,FR
; How much of each side's surface feel comes from its front tyre (0 to 1); the rear tyre supplies the rest.
FrontWeight=0.65
;
; How each value changes the road effect on that surface (tarmac and unknown ground are left as they are):
;   Amp       multiplier on the road strength.
;   Grain     added to RoadGrain: how random the strength and pitch are (-1..1).
;   Dropout   extra gaps between the weakest hits (0 to 0.6): grainy, broken-up feel.
;   Hz        multiplier on the road pitch (lower = softer and slower, higher = sharper).
;   Attack    how fast the effect rises (0.05 to 1).
;   Release   multiplier on how fast it dies away (large = short, sharp hits; small = soft and lingering).
;   Base      multiplier on the everyday strength between hits.
;   Spark     chance per 12 ms and side of a single hard hit, a stone or a crack (0 to 0.5).
;   SparkMul  strength of that hit (0.5 to 3).
;   Floor     least texture level, so smooth ground (snow, ice) still gives a faint feel (0 to 0.6).

; Seconds to cross-fade between two surfaces.
FadeSeconds=0.25
; How often the tyre data is read, and how long a new surface must hold before it is used (milliseconds).
ReadHz=50
CommitMs=150
; Advanced: address of the tyre class in RichardBurnsRally_SSE.exe. Only change it for a different RBR build.
TyreVtable=0x74288C

; Tarmac keeps the plain road feel by default (these values are neutral).
TarmacAmp=1
TarmacGrain=0
TarmacDropout=0
TarmacHz=1
TarmacAttack=0.55
TarmacRelease=1
TarmacBase=1
TarmacSpark=0
TarmacSparkMul=1
TarmacFloor=0

; Gravel: sharp, irregular grain with gaps and the odd hard stone.
GravelAmp=1
GravelGrain=0.1
GravelDropout=0.25
GravelHz=1.1
GravelAttack=0.6
GravelRelease=1.8
GravelBase=1
GravelSpark=0.07
GravelSparkMul=1.6
GravelFloor=0.2

; Snow: soft and slow, low pitch, little randomness, a light constant bed.
SnowAmp=0.55
SnowGrain=-0.7
SnowDropout=0
SnowHz=0.5
SnowAttack=0.12
SnowRelease=0.3
SnowBase=0.9
SnowSpark=0
SnowSparkMul=1
SnowFloor=0.22

; Ice: a quiet base with sparse, sharp, high-pitched cracks.
IceAmp=0.9
IceGrain=-0.4
IceDropout=0
IceHz=1.35
IceAttack=0.9
IceRelease=2.2
IceBase=0.3
IceSpark=0.1
IceSparkMul=2.4
IceFloor=0.3

; Soft ground (grass, rough verges): a rounder, heavier grain.
SoftAmp=0.9
SoftGrain=-0.2
SoftDropout=0.05
SoftHz=0.8
SoftAttack=0.35
SoftRelease=0.5
SoftBase=1
SoftSpark=0
SoftSparkMul=1
SoftFloor=0.18

; Cobblestone: hard like tarmac but made of separate ridges. Strong, regular and crisp, and the pitch follows
; your speed: one hit per ridge, so hits per second = speed / Ridge. When that is more than the wheel can play it
; drops by octaves instead of stopping at the top. The game's own table has no cobblestone entry, so the ids have to be
; assigned with Map= below (ForceFX.log names every ground id that has no class).
CobbleAmp=1.25
CobbleGrain=-0.6
CobbleDropout=0
CobbleHz=1
CobbleAttack=0.9
CobbleRelease=2.5
CobbleBase=1
CobbleSpark=0.04
CobbleSparkMul=1.5
CobbleFloor=0.4
; Metres between ridges (0.03 to 1). Smaller = faster, finer buzz; larger = slower, heavier thumps.
CobbleRidge=0.12
; Telemetry cobble detection: ground the game calls tarmac blends into the cobble feel when the tyres shake the way cobbles do
; (roughness per speed, smoothed over about a second; measured on a cobbled stage against plain tarmac). 0 = off, only Map= decides.
; Low and High are where the blend starts and where it is complete: lower = cobbles felt sooner, higher = only clearly rough ground.
CobbleDetect=1
CobbleDetectLow=0.5
CobbleDetectHigh=1.0

; Wooden bridge: planks across the road, a hit every plank, rounder and a little hollow.
WoodAmp=1
WoodGrain=-0.5
WoodDropout=0
WoodHz=1
WoodAttack=0.7
WoodRelease=1.2
WoodBase=1
WoodSpark=0
WoodSparkMul=1
WoodFloor=0.3
WoodRidge=0.25

; Correct the surface type of single material ids, as id:type pairs separated by commas.
; Types: tarmac, gravel, snow, ice, soft, cobble, wood, none ("none" leaves the feel unchanged on that id).
; Also accepted: cobblestone, wooden, bridge, planks, asphalt, dirt, grass. Anything the plugin can't use is named in ForceFX.log ("Map: ignored ...").
; Edits to this file take effect when RBR starts, so restart the game after changing Map=.
; Example: Map=88:snow,92:none,201:cobble,202:wood
; The plugin logs every surface change to ForceFX.log, and the Diagnostics page shows the material ids
; under the four tyres, so you can see which id is which. Ground ids that have no class at all are logged once
; ("ground material id N ... has no surface class"): that is how cobblestone and bridge ids are found.
Map=
