[ForceFX]
; RBR_ForceFX configuration
; Settings can be changed in the RBR menu at Plugins > ForceFX or edited here.
; Menu changes are saved to this file. Manual edits take effect when RBR starts.
;
; Effect strengths use DirectInput magnitude units. The plugin clamps settings
; to their supported ranges and enforces a hard limit on combined output.

; Connection and telemetry
; UDP port used to receive NGP telemetry. Configure NGP to send telemetry to
; this same port. Choose a port not already in use on your system.
UdpPort=6778
; Minimum accepted telemetry packet size in bytes. Change only if required by
; a compatible telemetry format.
MinPacketBytes=664
; DirectInput wheel device name. Select a device from the in-game Wheel menu;
; the selected name is saved here.
Wheel=
; 1 = connect to the configured wheel at startup; 0 = connect from the menu.
AutoConnect=0

; Effect levels and mixing
; Maximum engine vibration strength. Engine feedback has the lowest priority.
EngineMaxMagnitude=1200
; Maximum combined road, surface, and bump feedback strength.
RoadMaxMagnitude=3000
; Maximum braking judder and front-wheel lock-up feedback strength.
BrakeMaxMagnitude=2000
; Peak landing and impact strength, including the landing kick and body. Landings
; are short pulses, so this may exceed TotalMaxMagnitude (hard limit: 8000).
ImpactMaxMagnitude=8000
; Combined output limit for all effect layers. Lower this if feedback feels too
; strong or to use a more conservative output level. Hard limit: 5000.
TotalMaxMagnitude=4000
; Strength of priority mixing, from 0 to 1. Landings take priority over road
; and engine effects; road takes priority over engine. Brake effects are only
; reduced by landings. Set to 0 to disable priority-based reduction.
PriorityDuck=0.85

; Landing and impact feedback
; Landing sensitivity: 0 disables landing feedback; higher values increase it
; (0 to 3). At 1.5 or more, even moderate landings reach full strength.
ImpactGain=1.5
; Share of landing strength used for the directional kick (0 = body only,
; 1 = kick only). The remaining strength is used for the landing body.
LandingJolt=0.8
; Landing-body pitch multiplier. 1 = default; lower values produce a deeper feel.
ImpactHzScale=1
; Sensitivity threshold for detected impacts without airtime. Increase this if
; normal weight transfer triggers impact feedback; decrease it if hard hits are
; missed. Real airtime landings are not affected by this threshold.
LandingThreshold=1
; Fraction of the car's static tyre load below which it is considered airborne.
; Adjust to tune detection of smaller jumps versus bumps.
LandingAirLevel=0.45
; Strength of the left-right kick fired by ordinary bumps (0 = landings only, 2 = max).
; Landings and bumps share the same kick; this scales only the bump-triggered ones.
BumpKick=1
; Strength of the compression thump added during landings and heavy compression.
ThumpGain=1.4

; Braking feedback
; Braking judder pitch multiplier. 1 = default.
BrakeHzScale=1
; Front-wheel lock-up detection threshold. Lower values trigger feedback sooner.
LockThreshold=0.12
; Initial tyre circumference estimate in metres, used until measured from
; telemetry while coasting.
TyreCircumference=1.95

; Engine feedback
; Engine cylinder count, used to calculate the vibration pulse rate.
Cylinders=4
; Engine vibration frequency range in Hz. Frequency follows engine speed.
EngineMinHz=14
EngineMaxHz=100
; Assumed rev limit when telemetry does not provide one. 0 = estimate it from
; telemetry, starting with RpmMaxInit.
RpmMax=0
RpmMaxInit=7500
; High-rev engine texture (0 = smoother, 1 = rougher and more irregular).
EngineGrit=0.5
; Strength of the low-speed idle pulse.
LumpScale=1
; Uneven engine firing amount (0 = even firing; higher values add variation).
Unevenness=0

; Road and suspension feedback
; Road vibration frequency range in Hz. Feedback pitch varies with speed and
; detected surface roughness.
RoadMinHz=25
RoadMaxHz=100
; Speed in metres per second at which speed-dependent effects reach full scale.
MaxSpeed=40
; Tyre-roughness range mapped to road feedback. RoughGamma shapes the response
; curve: 1 = linear; higher values make feedback build up later.
RoughLow=0.03
RoughHigh=0.35
RoughGamma=1.0
; Road texture coarseness: 0 = smoother vibration; 1 = coarser, more irregular.
RoadGrain=0.9
; Left/right separation: 0 = similar feedback on both sides; 1 = fully
; independent side feedback.
RoadDirectional=0.7
; Set to 1 to reverse the directional road response and landing kick.
RoadSideInvert=0
; Influence of tyre load on left/right road feedback. 0 = ignore load difference.
LoadInfluence=0.6
; Contribution of vertical acceleration to road bump feedback.
BumpScale=0.25
; Amount road and engine feedback fade while the car is airborne (0 = no fade,
; 1 = fade out fully).
AirborneFade=1
; Overall vehicle weight feel. Higher values produce a heavier thump, slower
; decay, and lower road/landing pitch. A car profile may override this value.
WeightFeel=1.2
; 1 = apply per-car settings from ForceFXCars.ini; 0 = use these settings only.
CarProfiles=1

; Output protection
; Sustained-output limit used by the plugin's gradual derating protection.
; Lower values apply more conservative protection.
SustainedLimit=0.1

; Live level and hotkeys
; Overall live level, from 0 to 1. This scales effects down from their configured
; levels and cannot raise output above the configured limits. Updated by the
; in-game menu or hotkeys and saved here.
UserGain=1
; Per-press multiplier for the live-level increase/decrease hotkeys.
GainRatio=0.85
; Hotkey values are decimal Windows virtual-key codes; 0 disables a hotkey.
; These hotkeys are active while RBR is the foreground window.
KeyGainUp=107
KeyGainDown=109
; Hotkey for muting or restoring the added ForceFX effects.
KeyMute=106
; Modifier key required with the hotkeys: 0 = none, 17 = Ctrl, 16 = Shift,
; 18 = Alt.
KeyModifier=0
; 1 = play a beep when the live level changes.
GainBeep=1

; Advanced telemetry layout
; Byte offsets used to read values from NGP telemetry packets. Change these only
; if the telemetry packet format used by your setup differs from the defaults.
; Values are 32-bit floats unless otherwise noted.
OffsetCarIndex=56
OffsetThrottle=28
OffsetBrake=32
OffsetSpeed=60
OffsetAccHeave=120
OffsetRpm=136
; Rev-limit offset; -1 means the packet does not contain a rev limit.
OffsetRpmMax=-1
; Start of the suspension data and the byte size of each wheel entry.
OffsetSuspBase=152
SuspStride=128
; Offsets within each wheel entry for strut force, damper velocity, and tyre
; surface segment (the surface segment is a 32-bit integer).
OffsetStrutForce=16
OffsetPistonVel=28
OffsetTyreSegment=60
; 1 = telemetry speed is in km/h; 0 = speed is in metres per second.
SpeedIsKph=0
; Scale factor applied to telemetry engine RPM.
RpmScale=1
