[ForceFX]
; ============================================================================
;  RBR_ForceFX settings
;  Lines starting with ; are comments. Changes made in the in-game menu
;  (RBR > Plugins > ForceFX) are written to this file immediately and keep
;  these comments. Edits made here by hand are read when RBR starts.
;
;  Strength numbers ("magnitudes") use DirectInput units: 10000 = 100% of the
;  wheel's torque for that effect on its own. The plugin also enforces a hard
;  safety ceiling of 5000 for the total, however high you set the values.
;  Values outside a setting's allowed range are pulled back automatically.
; ============================================================================

; ---------------------------------------------------------------- connection
; UDP port the plugin listens on for RBR's NGP telemetry. It must match the
; port set in NGP's telemetry output. Never share a port with another tool
; (6776 = SimHub, 6777 = RbrSurfaceAudio).
UdpPort=6778
; Packets shorter than this many bytes are ignored. Leave as is.
MinPacketBytes=664
; Name of the force feedback wheel to use. The menu writes this when you
; connect. Leave it empty on a new install and pick the wheel in the menu.
Wheel=
; 1 = connect to the wheel above automatically when RBR starts, 0 = wait for
; you to press Select on the Wheel row in the menu.
AutoConnect=0

; ------------------------------------------------- strength of each layer (gains)
; Maximum strength of the engine vibration. Lowest priority: it falls back
; when road or landings are active.
EngineMaxMagnitude=1200
; Maximum strength of the road / surface / bump feel (both sides together).
; Second priority.
RoadMaxMagnitude=3000
; Maximum strength of the braking judder and front wheel lock-up.
BrakeMaxMagnitude=2000
; Maximum strength of a landing (the kick plus the body under it share this).
; Highest priority. Capped at 5000.
ImpactMaxMagnitude=5000
; All layers together are scaled down so they never exceed this. Range 500 to
; 5000. This is the main "overall strength" limit; lower it if the wheel feels
; harsh or the base runs hot.
TotalMaxMagnitude=4000
; How strongly the layers push each other back, 0 to 1. Priority is landing >
; road > engine: while a landing is active road and engine fall back, and
; engine also falls back under strong road. 0 = off (everything plays at once),
; 1 = lower layers can go almost silent. Brake is only pushed back by landings.
PriorityDuck=0.85

; ---------------------------------------------------------------- landings
; Landing sensitivity, 0 to 2. Multiplies how hard a detected landing is
; treated. 1 = normal, 0 = landings off, 2 = every landing treated as harder.
ImpactGain=1
; Share of the landing strength played as the "kick", 0 to 1. The kick is a
; one-direction push followed by a small rebound (a thud-thump). The rest is a
; short smooth low-pitched body underneath it. 0 = body only, 1 = kick only.
LandingJolt=0.8
; Pitch of the landing body, multiplier 0.5 to 2 (1 = normal, lower = deeper).
ImpactHzScale=1
; How hard a landing with NO airtime (a drop, crest or bottoming out) must be
; before it counts, 0.5 to 3. Raise it if braking or cornering weight transfer
; triggers landings; lower it if hard hits are missed. Landings after real
; airtime are not affected.
LandingThreshold=1
; Total tyre load, as a fraction of the car's static load, below which the car
; counts as airborne, 0.2 to 0.8. Raise it to catch smaller jumps; lower it
; if bumps are mistaken for jumps.
LandingAirLevel=0.45
; Strength of the compression "thump" the road layer adds on landings and
; heavy compressions, 0 to 2.
ThumpGain=1.4

; ---------------------------------------------------------------- braking
; Pitch of the braking judder, multiplier 0.5 to 2 (1 = normal).
BrakeHzScale=1
; Wheel speed deficit, relative to the car's speed, where front wheel lock-up
; starts to be felt. Lower = lock-up is felt earlier.
LockThreshold=0.12
; Tyre circumference in metres. Only used until the plugin has measured it
; while coasting.
TyreCircumference=1.95

; ------------------------------------------------------------------ engine
; Number of cylinders. Engine pulses per revolution = cylinders / 2.
Cylinders=4
; Engine vibration frequency at idle and at the rev limit, in Hz (12 to 120).
; Frequencies in between follow the revs.
EngineMinHz=14
EngineMaxHz=100
; Rev limit to assume when the telemetry does not provide one. 0 = learn it
; from the data, starting from RpmMaxInit.
RpmMax=0
RpmMaxInit=7500
; Engine roughness, 0 to 1. 0 = clean smooth vibration at high revs,
; 1 = rough, beating and irregular.
EngineGrit=0.5
; Strength of the idle lump / beat, 0 to 2.
LumpScale=1
; Uneven firing, 0 to 1 (boxer, five-cylinder, cross-plane V8). 0 = even.
Unevenness=0
; How strongly damper piston speed counts toward road strength. This is what
; picks up sharp hits and kerbs.
PistonScale=1

; -------------------------------------------------------------------- road
; Road vibration frequency range in Hz. The pitch rises from RoadMinHz to
; RoadMaxHz with speed and with how rough the surface is (mostly the surface).
RoadMinHz=25
RoadMaxHz=100
; Speed that counts as "full speed" for speed-dependent effects, in metres per
; second (40 = 144 km/h).
MaxSpeed=40
; Tyre roughness range mapped to road strength. Below RoughLow the surface
; counts as smooth tarmac, at RoughHigh it is fully rough. RoughGamma shapes
; the curve (1 = straight line, above 1 = rough surfaces ramp up later).
RoughLow=0.03
RoughHigh=0.35
RoughGamma=1.0
; Road coarseness, 0 to 1. 0 = smooth buzz, 1 = coarse irregular grain.
RoadGrain=0.9
; Left / right separation, 0 to 1. 0 = both sides feel identical, 1 = bumps on
; the left and right tyres are fully separate.
RoadDirectional=0.7
; 1 = swap which side pushes which way. Use it if left bumps push the wheel
; the wrong way for your wheel or seating. Also flips the landing kick.
RoadSideInvert=0
; How strongly the more heavily loaded side is favoured, 0 to 1.
; 0 = ignore tyre load.
LoadInfluence=0.6
; How strongly sudden up-and-down (heave) acceleration spikes count as bumps
; in the road layer.
BumpScale=0.25
; 1 = road and engine go quiet when the wheels are off the ground,
; 0 = they keep playing in the air. Range 0 to 1.
AirborneFade=1
; Car weight feel, 0.5 to 2. Higher = heavier car: stronger thump, slower
; decay, lower road and landing pitch. Car profiles can override it.
WeightFeel=1.2
; 1 = use per-car settings from ForceFXCars.ini, 0 = ignore that file.
CarProfiles=1

; --------------------------------------------------------------- safety
; Thermal protection. If the effects average out above this level for a long
; time, everything is gradually turned down (derate). 0.02 to 0.20; lower is
; more cautious. 0.10 is roughly a third of full strength continuously.
SustainedLimit=0.1

; ------------------------------------------------- live level and hotkeys
; Live level, 0 to 1. Scales everything. It can only reduce, never exceed the
; strengths above. The hotkeys and the menu change it and save it here.
UserGain=1
; Each hotkey press multiplies or divides the level by this (0.5 to 0.95).
GainRatio=0.85
; Hotkeys, as decimal Windows virtual-key codes (0 = disabled). They work while
; RBR is the active window: 107 = Numpad +, 109 = Numpad -, 106 = Numpad *.
KeyGainUp=107
KeyGainDown=109
; Mute / unmute all vibration.
KeyMute=106
; Key that must be held with the hotkeys above: 0 = none, 17 = Ctrl,
; 16 = Shift, 18 = Alt.
KeyModifier=0
; 1 = beep when the level changes (higher pitch = higher level).
GainBeep=1

; ------------------------------------------------ telemetry packet layout
; Advanced: where each value sits in the NGP telemetry packet, as byte offsets.
; Only change these if NGP's packet layout changes. Values are 32-bit floats
; unless noted.
; Car index in the packet.
OffsetCarIndex=56
OffsetThrottle=28
OffsetBrake=32
OffsetSpeed=60
OffsetAccHeave=120
OffsetRpm=136
; Rev limit in the packet (-1 = the packet has none).
OffsetRpmMax=-1
; Start of the suspension block and the size of each wheel's entry.
OffsetSuspBase=152
SuspStride=128
; Within each wheel entry: strut force, damper piston velocity and the tyre
; surface segment (a 32-bit integer).
OffsetStrutForce=16
OffsetPistonVel=28
OffsetTyreSegment=60
; 1 = the packet speed is in km/h, 0 = metres per second.
SpeedIsKph=0
; Multiplier applied to the rpm value from the packet.
RpmScale=1
