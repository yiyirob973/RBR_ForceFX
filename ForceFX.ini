[ForceFX]
; RBR_ForceFX configuration
; Settings can be changed in the RBR menu at Plugins > ForceFX or edited here.
; Menu changes are saved to this file. Manual edits take effect when RBR starts.
;
; Effect strengths use DirectInput magnitude units. The plugin clamps settings
; to their supported ranges and enforces a hard limit on combined output.

; Connection and telemetry
; Where telemetry comes from. NGP needs UDP telemetry switched on, but it can send to any
; port, including one that SimHub or another tool already uses.
;   0 = Auto (default): read NGP's packets as it sends them, and also listen on UdpPort as a backup.
;   1 = Hook only: read NGP's packets as it sends them and never open a port.
;   2 = UDP only: don't hook anything; listen on UdpPort. NGP must send to that port.
TelemetrySource=0
; Backup UDP port, used when TelemetrySource is 0 or 2. Set it to 0 to never open a port.
; You only need to point NGP at it if the hook can't see NGP's packets on your setup.
; Choose a port that no other application uses.
UdpPort=6778
; Minimum accepted telemetry packet size in bytes. Change only if required by
; a compatible telemetry format.
MinPacketBytes=664
; DirectInput wheel device name. Select a device from the in-game Wheel menu;
; the selected name is saved here.
Wheel=
; 1 = connect to the configured wheel at startup; 0 = connect from the menu.
AutoConnect=0

; Effect switches (1 = on, 0 = off). Also available at the top of the in-game menu;
; useful for diagnosing how each effect feels on its own.
EnableEngine=1
EnableRoad=1
; The road vibration (and the brake judder) is added to RBR's own steering force, so the wheel gets no extra effect that
; could make it heavy or sticky to turn. Without RBR's force updates (menus, test mode) it plays as an effect of its own.
; Brake feel: the judder under braking, the scrub when the front wheels lock, and RBR's force going light while they are locked.
EnableBrake=1
EnableLandingBoost=1
; Water: a heavy thump and a tug on the wheel when a tyre hits standing water (harder the faster you go), a churning rumble
; while the tyres are in it, and a smaller kick when they come out. Only standing water counts (the game's Water_Surface and the
; ids in WaterIds below); wet tarmac and wet gravel are left to the road feel. The thump rides on the same three bands as the
; road feel and the tug scales RBR's own force, like the landing boost, so it never pushes the wheel on its own.
EnableWater=1
; Strength of all of it, 0 to 2. At 1 a full-speed splash is about as hard as a heavy kerb strike; the rumble stays well below that.
WaterGain=1
; Heavy steering while the front tyres push through standing water, 0 to 2: the water drags on the turned tyres and wants to keep
; them straight. It scales RBR's own force up (0.6 = 60% more, 1 = double, never more than triple), from a crawl upwards, so it never
; pushes the wheel on its own. 0 = off.
WaterHeaviness=0.6
; More material ids to treat as standing water, for stages whose fords use other ids than the game's Water_Surface (157, built
; in). Comma separated, for example WaterIds=200,201. The surface log lists every ground id the car drives on.
WaterIds=
; Weight transfer: the steering force follows where the car's weight is. The plugin reads the share of the weight on each tyre from the four
; strut forces. Along the car: acceleration moves weight to the rear, the front tyres have less load to push against and the steering goes
; lighter; braking moves it forward and the steering goes heavier, in proportion to the front load lost or gained against the car standing
; still on the start line (known from the first moment of the launch). Across the car: the steering gets a little heavier as the weight builds
; up on the outside tyres in a corner (it follows the body roll, a moment after the steering) and swells while the weight swings across the
; car in a direction change, like a Scandinavian flick. It only scales RBR's own steering force and never pulls the wheel by
; itself. It reads the load, the ground speed and the sideways acceleration, not the pedals: the load share is noisy on a rough road, so the
; front effects wait until the ground speed says the car really accelerates or slows down, and the sideways ones for real sideways
; acceleration. ForceFX.log shows how far the weight moves ("Weight transfer: ...").
EnableWeightTransfer=1
; Lighter steering when the front loses load under acceleration. 1 = the steering loses force in proportion to the front load lost, never by
; more than 60%. 0 = off, 2 = twice as much.
WeightLightness=1
; Heavier steering when the front gains load under braking. RBR already makes it heavier, so this is off. 1 = the steering gains force in
; proportion to the front load gained, never by more than 60%. 0 = off, 2 = twice as much.
WeightHeaviness=0
; Cornering weight. 1 = up to 25% more force from cornering load and up to 35% more while the load swings across (never more than 50%
; together). 0 = off, 2 = twice as much.
WeightCornering=1
; Brake lock-up: when the front tyres lock they stop gripping and the steering goes light. 1 = RBR's force drops by half while both are
; fully locked (never more than 70%); 0 = off, 2 = twice as much. The lock-up comes from the wheel speed against the ground speed.
LockLightness=1
; Crash jolt: when the car hits something (a tree, a rock, a wall) the wheel is yanked for a moment: RBR's own force times (1 + CrashBoost)
; and a minimum extra push of CrashMinPush of full torque, both scaled by how hard the hit was.
EnableCrash=1
CrashBoost=0.8
CrashMinPush=0.15
; The most RBR's own steering force is ever scaled by, all the boosts together (landing, water, crash, ...), 1 to 4. Nothing gets past it.
MaxForceMultiplier=3
; Lets the ground under each tyre shape the road feel, together with the car's speed and wheel slip (see the
; [Surface] section at the end of this file). It needs EnableRoad=1. At 0 the road feels the same on every surface.
; There are no per-surface settings: RoadMaxMagnitude is the one setting for how strong the road feel is.
EnableSurfaceFeel=1
; Dynamic audio: tyre and ground sounds for each wheel. Off by default. Needs sound files in
; Plugins\ForceFXAudio\sounds and the mix levels in the [Audio] section below. Also the first switch in the in-game menu.
EnableDynamicAudio=0
; Live multipliers for the dynamic audio, also in the menu (1 = as set in [Audio] below).
AudioDebrisLevel=1
AudioImpactLevel=1
AudioSuspensionLevel=1
; Live level of the wet-ground treatment in the audio ([Audio] Wet* below): 0 = off, 1 = as set there, 2 = twice as much.
AudioWetLevel=1
; Live level of the interior noises (fan, wind, panel buzz, rattles), heard only in the cockpit view: 0 = off, 1 = normal, 2 = twice.
AudioCabinLevel=1
; Camera movement: your head moves with the car in the cockpit view (leaning into braking and corners, nodding,
; bouncing over bumps, shaking on crashes and landings). Settings are in the [Camera...] sections below. Also in the in-game menu.
EnableCamera=0
; Rain, snow and mud on the windscreen of the cockpit view. Off by default. It is read when RBR starts, so restart
; RBR after switching it on. Settings are in the [Windscreen] section below.
EnableWindscreen=0

; Effect levels and mixing
; Maximum engine vibration strength. Engine feedback has the lowest priority.
EngineMaxMagnitude=1200
; Maximum combined road, surface, and bump feedback strength.
RoadMaxMagnitude=500
; Maximum braking judder and front-wheel lock-up feedback strength.
BrakeMaxMagnitude=2000
; Combined output limit for all effect layers. Lower this if feedback feels too
; strong or to use a more conservative output level. Hard limit: 5000.
TotalMaxMagnitude=4000
; Strength of priority mixing, from 0 to 1. Road takes priority over engine.
; Set to 0 to disable priority-based reduction.
PriorityDuck=0.85

; Landing and impact feedback
; Landing sensitivity: 0 disables landing feedback; higher values increase it
; (0 to 3). At 1.5 or more, even moderate landings reach full strength.
ImpactGain=0.7
; Landing boost: when a landing after real airtime (at least 0.15 s off the ground) is detected, RBR's OWN steering
; force is scaled up for a fraction of a second (no separate effect is added on top). Bumps never trigger it.
; Extra torque at the peak of a full-severity landing, as a multiple of RBR's current
; force: 0 = off, 2 = +200% (three times RBR's force), 4 = +400%.
LandingBoost=1.1
; Minimum extra push in the direction RBR is already pushing, as a share of full
; torque (0 to 1). Helps when RBR's own force happens to be small at touchdown.
LandingMinPush=0.15
; Fraction of the car's static tyre load below which it is considered airborne.
; Adjust to tune detection of smaller jumps versus bumps.
LandingAirLevel=0.2
; Strength of the compression thump added during landings and heavy compression.
ThumpGain=1.4

; Braking feedback
; Braking judder pitch multiplier. 1 = default.
BrakeHzScale=1
; Car geometry for the per-tyre slip angles (wheelspin, slides, lock-up), in metres. A car profile in ForceFXCars.ini can set
; these per car, together with Drivetrain=RWD|FWD|AWD (which tyres can spin; RWD if a car does not say).
Wheelbase=2.5
CgToFront=1.25
TrackWidth=1.5
; Initial tyre circumference estimate in metres, used until measured from
; telemetry while coasting.
TyreCircumference=1.95

; Engine feedback
; (The cylinder count, rev limit, idle pulse and firing unevenness come from the car's entry in ForceFXCars.ini. A car without
; an entry gets a quieter engine and a note in ForceFX.log.)
; Engine vibration frequency range in Hz. Frequency follows engine speed.
EngineMinHz=14
EngineMaxHz=100
; High-rev engine texture (0 = smoother, 1 = rougher and more irregular).
EngineGrit=0.5

; Road and suspension feedback
; Road vibration frequency range in Hz. The road feel is three vibrations (low, mid and high), each covering a
; third of this range on a pitch scale. Their pitch rises with the car's speed and stays inside its third.
RoadMinHz=25
RoadMaxHz=100
; Speed in metres per second at which speed-dependent effects reach full scale.
MaxSpeed=40
; Tyre-roughness range mapped to road feedback. RoughGamma shapes the response
; curve: 1 = linear; higher values make feedback build up later.
RoughLow=0.03
RoughHigh=0.35
RoughGamma=1.0
; How much damper speed adds to road feedback, for hard hits and kerbs. 1 = default.
PistonScale=1
; Influence of tyre load on left/right road feedback. 0 = ignore load difference.
LoadInfluence=0.6
; Contribution of vertical acceleration to road bump feedback.
BumpScale=0.25
; Amount road and engine feedback fade while the car is airborne (0 = no fade,
; 1 = fade out fully).
AirborneFade=1
; Overall vehicle weight feel. Higher values produce a heavier thump, slower
; decay, and lower road/landing pitch. A car profile may override this value.
WeightFeel=1.2
; 1 = apply per-car settings from ForceFXCars.ini; 0 = use these settings only.
CarProfiles=1

; Output protection
; How much sustained vibration ForceFX will push into the wheel before it gradually
; backs off to protect the hardware. Lower values are more conservative.
SustainedLimit=0.1

; Live level and hotkeys
; Overall live level, from 0 to 1. It scales effects down from their configured
; levels and can never raise output above your limits. The in-game menu and the
; hotkeys change it, and the value is saved here.
UserGain=0.85
; Per-press multiplier for the live-level increase/decrease hotkeys.
GainRatio=0.85
; Hotkey values are decimal Windows virtual-key codes (107 = Numpad +, 109 = Numpad -,
; 106 = Numpad *); 0 disables a hotkey. The hotkeys only work while RBR is the foreground window.
KeyGainUp=107
KeyGainDown=109
; Hotkey for muting or restoring the added ForceFX effects.
KeyMute=106
; Modifier key required with the hotkeys: 0 = none, 17 = Ctrl, 16 = Shift,
; 18 = Alt.
KeyModifier=0
; 1 = play a beep when the live level changes.
GainBeep=1

; Advanced telemetry layout
; Byte offsets used to read values from NGP telemetry packets. You should only need
; to change these if your setup sends a different packet layout.
; Values are 32-bit floats unless otherwise noted.
OffsetCarIndex=56
OffsetThrottle=28
OffsetBrake=32
OffsetSpeed=60
OffsetAccHeave=120
OffsetAccSurge=112
OffsetAccSway=116
OffsetYawRate=108
OffsetSteering=24
OffsetHandbrake=36
OffsetRpm=136
; Rev-limit offset; -1 means the packet does not contain a rev limit (the car profile's RpmMax is used). ForceFX.log lists the floats of
; the first packet that could be a rev limit ("Rev limit candidate"): if one of them is, set it here.
OffsetRpmMax=-1
; Used by the audio and the camera, which read the packet through the same layout as the force feedback.
OffsetGear=44
OffsetCarRoll=76
OffsetVelHeave=96
; Start of the suspension data and the byte size of each wheel entry.
OffsetSuspBase=152
SuspStride=128
; Offsets within each wheel entry for strut force, damper velocity, and tyre
; surface segment (the surface segment is a 32-bit integer).
OffsetStrutForce=16
OffsetPistonVel=28
OffsetTyreSegment=60
; NGP's own step counter (totalSteps_, a 32-bit integer). It gives the wheel counters a clean clock, so uneven UDP
; arrival does not disturb the slip reading. -1 = do not use it (arrival time is used instead).
OffsetSteps=0
; The car's velocity over the ground in m/s (surge and sway): the real speed that the wheels' spin is compared with.
OffsetVelSurge=88
OffsetVelSway=92
; 1 = telemetry speed is in km/h; 0 = telemetry speed is in miles per hour.
SpeedIsKph=0
; Scale factor applied to telemetry engine RPM.
RpmScale=1

[Surface]
; Road feel from the ground: the plugin reads which material is under each tyre (read-only, from RBR's own contact
; data), works out how hard, loose, coarse and slippery it is from the material's name, and shapes the road
; vibration from that together with the telemetry (speed, wheel slip, how rough the tyres measure). There are no
; per-surface values to tune; the road gain (RoadMaxMagnitude, also in the in-game menu) sets how strong it is.
; The switch is EnableSurfaceFeel above. Edits here take effect when RBR starts.
;
; Each tyre is read separately (front left, front right, rear left, rear right). TyreOrder says which wheel
; each tyre object is, in the order the plugin finds them in memory. Measured on test drives: rear pair first, then
; the front pair, each left then right. If left and right feel swapped, try RR,RL,FR,FL.
TyreOrder=RL,RR,FL,FR
; How much of each side's ground comes from its front tyre (0 to 1); the rear tyre supplies the rest. 0.90 = 90:10.
FrontWeight=0.90

; Seconds to cross-fade between two surfaces.
FadeSeconds=0.25
; How often the tyre data is read, and how long a new surface must hold before it is used (milliseconds).
ReadHz=50
CommitMs=150
; Advanced: address of the tyre class in RichardBurnsRally_SSE.exe. Only change it for a different RBR build.
TyreVtable=0x74288C

; Override the ground of single material ids, as id:type pairs separated by commas. An id listed here ignores the
; material's own name and gets a typical ground of that type.
; Types: tarmac, gravel, snow, ice, soft, none ("none" gives plain hard ground with no special character).
; Also accepted: asphalt, dirt, grass. Anything the plugin can't use is named in ForceFX.log ("Map: ignored ...").
; Edits to this file take effect when RBR starts, so restart the game after changing Map=.
; Example: Map=88:snow,92:none,201:gravel
; The plugin logs every surface change to ForceFX.log, and the Diagnostics page shows the material ids
; under the four tyres, so you can see which id is which. Ground ids that have no class at all are logged once
; ("ground material id N ... has no surface class").
Map=

[Audio]
; Dynamic audio. Switch it on in the in-game menu (Plugins > ForceFX > Dynamic audio)
; or with EnableDynamicAudio=1 in [ForceFX]. Telemetry and the ground under each tyre come from ForceFX itself, so there is
; no UDP port to set up, and the speed unit is SpeedIsKph in [ForceFX]. Changes here are read when the audio is switched on.
; Lines are "key = value". ';' starts a comment.
MasterVolume = 1.0        ; drive into the soft limiter: keep near 1.0; higher = denser/more saturated, not just louder
TotalGain = 1.0           ; overall loudness of the plugin, applied last (0 = silent, 0.5 = half, 2.0 = double; max 8; hard-clips at full scale)
OutputDevice = -1         ; -1 = default waveOut device (ForceFX.log lists the device numbers when the audio starts)
; Mix balance per tyre (all sound files are first brought to the same loudness). Lower = quieter.
NormalizeSounds = 1
LoopLevel = 0.25          ; rolling noise while cruising (keep low: it is the constant background)
LoopRoughBoost = 2.0      ; extra rolling noise at full slip or very rough ground: level = LoopLevel * (1 + boost)
; Damp and wet ground. The game says how wet the ground under each tyre is, and the dry loops are changed to match unless you have a real
; recording of it (gravel_wet_loop.wav, tarmac_damp_loop.wav, ... a loop named wet or damp is used as it is): loose ground gets duller and a
; little quieter, a soft spray hiss grows with speed (wet_hiss_loop.wav replaces the one made in code), and thrown stones are fewer, with
; some landing in water. Each amount is 0 (none) to 1 (full effect on wet ground; damp ground gets half). Set WetTreatment = 0 to switch it all off.
WetTreatment = 1
WetTone = 0.6             ; how dull loose ground gets when wet
WetCrunch = 0.3           ; how much quieter the dry loop gets on loose ground when wet
WetHiss = 0.5             ; level of the spray hiss, as a share of LoopLevel
WetStones = 0.4           ; how many fewer stones fly from wet loose ground
SquealLevel = 0.5         ; wheelspin squeal: a driven tyre turning faster than the ground under power
SlideLevel = 0.5          ; sliding noise: a tyre sliding sideways, or locked under braking or the handbrake
SquealStart = 0.8         ; how close to its grip limit a driven tyre is when wheelspin starts to squeal (1 = the limit). Lower = squeals earlier
SlideStart = 1.3          ; how far past its grip limit a tyre is when the sliding noise starts. Lower = slides sooner
EventLevel = 1.0          ; impacts and landings
StoneLevel = 2.0          ; stones and debris thrown at the car (0-6). Both levels can also be adjusted live in the ForceFX menu
RumbleLevel = 1.0         ; road-edge rumble
; Inside the car. This is not a switch: the plugin reads the game's camera, and in the cockpit view the sounds it plays are heard through
; the cabin (muffled, boomy, with short reflections) while in an outside view they are not touched; changing view crossfades. The interior
; also makes its own noise, made in code: the heater fan, wind round the glass, panels buzzing with the engine and things rattling over
; bumps and landings. All of it only inside. (A view the plugin cannot read counts as inside.)
; CabinAmbience is the level of those interior noises, 0 = none (AudioCabinLevel in [ForceFX] is the same thing live in the menu).
; The camera types that count as inside the car default to 3-6 (5 is the interior view); ForceFX.log says "camera type N: heard from
; inside/outside the car" whenever you change view, so you can see which number is which.
CabinAmbience = 1.0
; CabinCameraMin = 3
; CabinCameraMax = 6
StartupBeep = 1           ; 1 = play a short test tone when the plugin starts (set 0 once you hear it)

; Sounds: leave blank to use  Plugins\ForceFXAudio\sounds
SoundsFolder =

; Surface detection thresholds (tune with DebugLog: 'rough' on tarmac vs gravel)
LooseThreshold = 0.15
RoughThreshold = 0.45
SlipThreshold = 0.15

; Units - check the log line "a_y/(v*yaw)": ~1.0 is right; ~9.8 => AccelToMs2 = 9.81; ~57 => YawRateScale = 0.01745
AccelToMs2 = 9.81         ; measured on NGP 7.x: accelerations are in g
YawRateScale = 0.0174533  ; measured on NGP 7.x: yaw rate is in degrees/second

; Which tyres the engine drives and the car geometry (for the per-tyre slip angles) come from the plugin: Drivetrain in
; ForceFXCars.ini, Wheelbase / CgToFront / TrackWidth in [ForceFX].

; Per surface class (Tarmac, Loose, Rough, Slippery). PeakSlipRatio / PeakSlipAngleDeg: where a tyre gives the most grip on that ground;
; wheelspin and slides are measured against them (see SquealStart / SlideStart)
SurfaceNames = tarmac, gravel, grass, snow
ClassVolume = 0.7, 1.0, 0.9, 0.6
PeakSlipRatio = 0.10, 0.18, 0.20, 0.15
PeakSlipAngleDeg = 6, 12, 13, 10

; Streams on/off
EnableWheelLoops = 1
EnableSlide = 1
EnableSqueal = 1
EnableStones = 1
EnableImpacts = 1
EnableLandings = 1
EnableRumble = 1
DebugLog = 0             ; 1 = write what the tyre sounds are being told to ForceFX.log once a second (for tracking down a sound that sticks)
EnableSuspension = 1     ; suspension creaks and bottoming out (sounds: susp_squeak, susp_bottom)
SqueakLevel = 0.6         ; creak loudness (0-6). Creaks and bottoming out are rare events that follow the suspension telemetry: there is no rate setting
BottomOutLevel = 0.8      ; bump-stop thump loudness (0-6)
ImpactMinVelocity = 0.35
; Crashes: a tree, a big rock, a wall. Heard when the car's body takes a spike of several g that driving never makes and (unless it is a
; very hard one) the car loses speed right after it. One thump by how hard it was (light, medium or heavy: crash_light / debris_impact /
; debris_landing), with crumpling metal, twigs on nose-first hits and glass on the worst ones added on top. The telemetry cannot say what
; was hit, so the sound follows how hard and from where. Hard landings and jolts that keep the speed do not count. Each crash is written
; to ForceFX.log with its peak g, so you can tune CrashMinG from it. Needs a few corners driven first, to learn the acceleration units.
EnableCrashes = 1
CrashMinG = 3             ; peak body acceleration (1-12 g) that can be a crash. Lower = more sensitive; a spike over 2.3x this counts without waiting for the speed
CrashLevel = 1            ; crash loudness (0-6)

; ---------------------------------------------------------------------------------------------------------------
; If a future NGP changes the UDP packet, the field offsets are the Offset* keys in [ForceFX] above. The audio and the camera read
; the packet through the same offsets (one table for the whole plugin). Defaults match NGP 7.4.778 (rbr.telemetry.data.TelemetryData.h).
; The plugin goes silent and says so on its status page if values stop making sense.

; --- Two kinds of speed ---------------------------------------------------------------------------------------------
; The telemetry carries the car's true ground speed (velocity vector) and a speedometer value that follows the driven wheels.
; Ground speed drives everything that depends on how fast the car really moves; wheel speed shows wheelspin and lock-up.
; GroundSpeedSource = auto       ; auto = velocity vector (speedometer only if the vector is dead), velocity, or speedometer
; VelocityScale = 1.0            ; VelSurge/VelSway to m/s
; SpeedFieldScale = 1.609        ; speedometer / ground speed while rolling (learned while coasting; this is the start value)

; ------------------------------------------------------------------------------------------------------------------
; Camera module: head movement in the cockpit view, and the optional windscreen effects.
; The sections [Camera] to [CameraRender] are the camera, [Windscreen] and [WindscreenStages] the windscreen.
; Whether the camera and the windscreen are on at all is EnableCamera and EnableWindscreen in [ForceFX] (or the in-game
; menu). Everything else is below. A missing key uses its built-in default.
; Hot keys (RBR window focused, Ctrl held): F9 reloads the camera settings from this file, F10 camera on/off, F8 windscreen on/off.
; Telemetry comes through ForceFX, so NGP needs no extra UDP endpoint for the camera.
; ------------------------------------------------------------------------------------------------------------------

[Camera]
Apply=1              ; 1 = move the camera, 0 = log only
Log=0                ; 1 = write ForceFXCamera.log (one status line per second, for tuning and bug reports)
AnyExe=0             ; the camera hooks fixed addresses of the RallySimFans RichardBurnsRally_SSE.exe and stays off in any other executable. 1 = try anyway (can crash the game)
Method=4             ; 4 = patch the Direct3D matrices like openRBRVR does (default): no camera calls, wipers unaffected, supports roll
                     ; 2 = forced camera change: backup for VR users (openRBRVR) or if the D3D hooks fail; moves the camera but stops the wipers, no roll
                     ; 3 = experimental, avoid
AutoFallback=1       ; 1 = switch Method 4 to Method 2 automatically if openRBRVR.dll is loaded or the D3D hooks are not active after 10 s in a cockpit camera
MaxApplyHz=0         ; 0 = update the camera every frame. > 0 caps updates per second (e.g. 30); fewer updates = fewer wiper resets with Method 2, but steppier motion
Diag=0               ; 1 = log what the forced camera change modifies (Method 2), to find what stops the wipers (see README)
DiagDeep=0           ; 1 = also snapshot every object the camera structures point to (finds state stored elsewhere; slower, run once)
DiagAfter=300        ; run the diagnostic on forced change number 300, 301, 302 (so the wipers have been running)
Test=0               ; 1 = scripted test inputs (sit in the cockpit and watch; see README)
Intensity=1.0        ; one-knob strength: 0.5 = very subtle, 1.0 = natural (default), 1.5-2.0 = pronounced
ToggleKey=121        ; virtual-key code, 121 = F10 (0 = disabled)
ReloadKey=120        ; 120 = F9 (0 = disabled)
NeedCtrl=1           ; hot keys need Ctrl held

[CameraInput]              ; NGP acceleration looks like g (peaks ~0.5-1)
Smooth=0.35          ; low-pass on accelerations (0 = raw, 0.95 = very smooth)
AccelClamp=2.5       ; spikes (stage start, crashes, landings) are clamped to +-this
DeadZone=0.06        ; accelerations below this (g) are ignored, so small road noise does not wobble the view
MinSpeed=0           ; effects fade in between MinSpeed and FullSpeed (kph/mph as set in RBR)
FullSpeed=10
YawFloor=0.2         ; smallest yaw-rate / steering scale used for auto-normalisation
SteerFloor=0.1
InvertSurge=1        ; -1 flips an NGP signal if real driving moves the head the wrong way (Test mode looks right but driving does not)
InvertSway=1
InvertHeave=1
InvertYaw=1
InvertSteer=1

[CameraTranslation]        ; metres of static head offset per 1.0 of acceleration
Surge=0.028          ; forward/back
Sway=0.014           ; left/right
Heave=0.005          ; up/down
BrakeBoost=1.8      ; extra forward lean while the brake pedal is pressed (1 = none)
TorsoShare=0.70      ; fraction of the response taken by the slow torso spring (rest by the faster neck)
TorsoFreq=1.2        ; Hz
TorsoDamp=0.85
NeckFreq=3.0         ; Hz
NeckDamp=0.50        ; < 0.7 gives a little overshoot / wobble

[CameraBumps]              ; road texture: high-passed heave drives a stiff vertical spring
Gain=0.0015          ; metres per 1.0 of bump acceleration (0 = off)
Freq=6.0
Damp=0.65
HighPassTau=0.25     ; seconds: what counts as "slow" heave (lower = only sharper bumps)
Threshold=0.15       ; bump acceleration below this is ignored (higher = only big bumps and kerbs)

[CameraRotation]           ; degrees
PitchPerG=1.55        ; head nods down under braking, up under acceleration (0 = off)
PitchFreq=2.8
PitchDamp=0.58
LookYaw=2          ; look into the corner, full scale at the strongest yaw rate / steering seen (0 = off)
LookSteerMix=0.47    ; 0 = yaw rate only, 1 = steering only 
LookFreq=1.0
LookDamp=0.90
RollPerG=1.3         ; degrees of head tilt into the corner per g of sideways acceleration (Method 4 only, 0 = off)
RollFreq=2.4
RollDamp=0.60
HorizonLock=0.0      ; 0..1: cancel this fraction of the car's own body roll (like openRBRVR's horizon lock). 0 = off
CarRollScale=1.0     ; multiplier that turns NGP car roll into radians (use 0.01745 if the log shows degrees)
InvertCarRoll=1      ; -1 if HorizonLock tilts the wrong way

[CameraShift]
Kick=0.00            ; m/s forward impulse on up-shifts, backward on down-shifts (negative flips, 0 = off). Off by default: the car already kicks through the telemetry

[CameraImpact]             ; crashes, jumps and landings (everything here is scaled by Scale; 0 = all impact effects off)
Scale=1.0
CrashThreshold=3.0   ; horizontal acceleration (g) above this counts as a crash / hard hit
CrashIgnoreAbove=15  ; values above this are treated as telemetry glitches (stage-start teleport etc.)
CrashKick=0.25       ; head velocity kick (m/s) per g above the threshold
CrashPitchKick=25    ; nod kick (deg/s per g) for frontal hits
CrashRollKick=25     ; tilt kick (deg/s per g) for side hits (Method 4)
CrashCooldown=0.4    ; seconds between crash events
MaxKick=0.5          ; cap on any single translation kick (m/s)
AirLoadFraction=0.08 ; airborne when the total strut load falls below this fraction of its running maximum...
AirborneMs=120       ; ...for at least this long (ms)
LandLoadFraction=0.30 ; touchdown when the load rises above this fraction
AirTimeRef=0.6       ; air time (s) that counts as strength 1.0
LandRefG=2.5         ; vertical acceleration (g) that counts as strength 1.0
LandMinStrength=0.25 ; ignore tiny hops below this
LandMaxStrength=2.0
LandKick=0.25        ; downward head kick (m/s) per unit of landing strength
LandPitchKick=10     ; nod kick (deg/s) per unit of landing strength
AirLift=0.010        ; metres the head floats up while airborne (0 = off)
ShakePos=0.00       ; shake amplitude at full strength (metres)
ShakeAngleDeg=1.2    ; shake amplitude at full strength (degrees)
ShakeFreq1=11        ; shake frequencies (Hz)
ShakeFreq2=17
ShakeDecay=0.35      ; seconds for the shake to fade
ShakeGain=0.0       ; shake strength added per g of crash excess / unit of landing strength

[CameraLimits]
MaxPos=0.025         ; soft limit on head offset, metres (2.5 cm)
MaxAngleDeg=3        ; soft limit on pitch / look angle
MaxRollDeg=3         ; soft limit on head roll

[CameraAxes]               ; camera frame, from your log: forward = -Z, up = +Y, right = +X
Right=0
Up=1
Forward=2
SignRight=1
SignUp=1
SignForward=-1

[CameraRender]            ; Method 4 only. Signs are in Direct3D view space (x right, y up, z forward); Test=1 shows if one is wrong
FixedFunction=0      ; 1 = also patch fixed-function draws (needed for BTB / custom tracks if they do not move)
SignRight=1
SignUp=1
SignForward=1
SignPitch=1
SignYaw=1
SignRoll=1

[Windscreen]         ; Windscreen: rain, snow and mud on the glass of the cockpit view. Off by default: switch it on with EnableWindscreen in [ForceFX]
                     ; or in the menu, then restart RBR (its Direct3D hooks are only installed at startup when it is on). Ctrl+F8 switches it on/off live afterwards.
Mode=3               ; 1 = rain / snow only, 2 = mud only, 3 = both
DrawAt=1             ; where it is drawn: 1 = right after the game's own wet-windscreen function (before the HUD), 2 = right before it, 0 = end of frame (over the HUD)
DepthTest=1          ; 1 = the dashboard, pillars and wheel cover the drops (tested against the z-buffer at GlassDist), 0 = drawn over everything
GlassDist=0.9        ; metres from your eyes to the glass. Used for the depth test AND for how far the drops shift when your head moves. Drops show over the dash -> lower it
HideGameFx=1         ; 1 = the game's own windscreen drops / snow are not drawn (its logic still runs, so the wipers keep working). 2 = its function is skipped entirely.
                     ; 0 = leave the game's effect on. If the wipers or something else disappears, try 0 or 2. The log's gameDrawsHidden/s shows what was removed.
WetFromGame=0        ; experiment: 1 = rain only arrives while the game itself is drawing its wet-windscreen overlay. 0 = ignore that (it runs every frame anyway)
; ---- look
Pools=0              ; 1 = big standing drops are flat irregular grey pools. Off by default: on a moving car they look like pebbles. 0 = round clear beads
PoolMinPx=8          ; drops with at least this radius in pixels become pools
Micro=4000           ; most tiny droplets on the glass: the fine speckle that makes wet glass look wet. 0 = none (cheaper)
MicroRate=380        ; tiny droplets per second at rain level 1 (fewer when slow). Running drops sweep them away and leave a clean track
Veil=0.7              ; 0..1 how strongly a wet glass blurs the view behind it (a haze that builds up while it rains, between wiper strokes, and that the wipers and running drops clear). 0 = off
Refraction=1         ; 1 = drops are lenses: a copy of the frame is sampled upside down and magnified inside each drop. 0 = flat sprites (cheaper, automatic fallback if it fails)
RefractK=2.0         ; how wide a view each drop shows (higher = wider, smaller image)
RefractMinPx=4.0     ; drops smaller than this many pixels (radius) are plain sprites
Opacity=1.0          ; overall opacity
DropSize=1.0         ; water drop size multiplier
MudSize=1.0          ; mud size multiplier
SnowSize=1.0         ; snow flake size multiplier
; ---- rain and snow come from the game: its Good / Random / Bad weather preset is already resolved into a sky type and a surface wetness
RainSource=1         ; 1 = read the stage's sky type from the game (light / heavy rain, light / heavy snow, everything else = clear glass), 0 = always use RainLevel / SnowLevel
RainLight=0.45       ; rain level (0..1) on a light-rain stage
RainHeavy=1.0        ; rain level (0..1) on a heavy-rain stage
RainLevel=0.7        ; rain level used when RainSource=0, or when the game's values cannot be read
Rain=100              ; impacts per second at rain level 1 and full speed (fewer when slow). 0 = no new drops
Drops=450            ; most water drops on the glass at once (beads, flat pools and runners)
Trail=3.0            ; seconds the thin track a running drop leaves stays visible
SnowLight=0.5        ; snow level (0..1) on a light-snow stage
SnowHeavy=1.0        ; snow level (0..1) on a heavy-snow stage
SnowLevel=0.0        ; snow level used when RainSource=0
SnowRate=18          ; flakes per second at snow level 1 and full speed
SnowMax=140          ; most flakes on the glass at once
SnowMelt=14          ; seconds before a flake melts into a water drop (which then evaporates)
; ---- mud: thrown while driving fast on a rough, wet surface (road roughness comes from the heave telemetry), plus landings and impacts
MudRate=10            ; mud splatters per minute at full speed on a fully rough, wet surface. 0 = only landings and impacts
RoughRef=0.25        ; heave roughness that counts as a fully loose surface. Mud on tarmac -> raise it, no mud on gravel -> lower it (the log shows rough= and loose=)
MudDry=0.15          ; mud multiplier on a dry road (dust, not mud), read from the game's surface wetness
MudDamp=0.7          ; ... on a damp road
MudWet=1.0           ; ... on a wet road
MudSnow=0.6          ; ... on a snow stage (the splatters are grey slush)
Mud=30               ; most mud splats on the glass at once (the oldest fade away)
CarryOver=1          ; 1 = mud and dirt stay on the glass from one stage to the next of the same rally (water dries), so cleaning it costs time. The glass is cleaned
                     ; fully for a new car, a different driver, a stage that was not finished (retired, restarted, left for the menu), the same stage again,
                     ; or after CarryMinutes. 0 = every stage starts clean
CarryMinutes=10      ; minutes between the end of one stage and the start of the next after which it is taken as a new rally and the glass is cleaned. 0 = never by time
Ground=1             ; 1 = what is thrown at the glass follows the surface scan (the material under each tyre): dry gravel throws pale dust, wet dirt dark mud,
                     ; grass a green-brown smear, snow grey slush, wet tarmac grey road spray, clean tarmac nothing. The colours follow MudR/MudG/MudB.
                     ; 0 = the old estimate (road roughness and the stage's wetness) and one mud colour
GrimeLife=300        ; seconds (at full speed; slower when slow) for dirt that wipers cannot reach to dry and flake off, so the corners of the glass do not fill up for ever. 0 = never
MudSmear=1           ; 1 = wipers drag mud into a smear instead of just deleting it
; ---- telemetry decides how it all behaves
SpeedRef=120         ; km/h at which airflow is "full": rain rate, and how hard the wind pushes drops up the glass
Wind=1.0             ; how strongly speed blows drops up the glass (0 = never)
Gravity=1.0          ; how strongly cornering / braking / accelerating pushes drops (0 = they never slide)
SignSway=1           ; -1 if drops slide the wrong way in corners
SignSurge=1          ; -1 if drops slide the wrong way under braking / acceleration
; ---- haze, particles in flight, mud, wipers
Dirt=1.0             ; 0..2 how strongly mud hazes the view: a brown frosted halo around every splat plus a smear of dirty glass that wipers only partly clear. 0 = off
Glow=0.05            ; 0..0.6 bloom through wet glass (bright lights glow). 0 = off
FilmDecay=0.15       ; how fast the water haze drains away by itself (per second). Higher = clears quicker between wiper strokes
Fly=1                ; 1 = rain streaks, snow flecks and mud clods travel to the glass and hit it (rain from the vanishing point, mud off your wheels or thrown by a car ahead). 0 = they just appear
FlyTime=0.28         ; seconds a raindrop takes to arrive (mud takes 0.3-0.45 s)
Spray=1.0            ; dirty road spray thrown up on wet roads and in rain, multiplier (0 = off)
MudR=0.52            ; mud colour (0..1). Reddish clay: 0.62,0.36,0.24   grey slate: 0.42,0.40,0.38
MudG=0.40
MudB=0.28
WiperThick=1.0       ; thickness of the plugin's wiper arm and blade (1 = real size)
WiperBow=1           ; 1 = the blade pushes a ridge of water ahead of it (more water = a thicker ridge)
WiperBlur=1          ; 1 = motion-blur wedge behind a moving blade
; ---- wipers: the car's wipers are a 3D model, so the plugin hunts for them among the game's draw calls (the blade whose matrix swings with a regular rhythm)
Wipers=1             ; 1 = wipers sweep drops, flakes, streaks and mud away. 0 = off
WiperSource=1        ; 1 = find the car's real blades automatically (about 12 s into a rain stage, see the "WiperHunt" lines in the log) and follow their real pose.
                     ; Until then, and if nothing is found, the emulated blades below are used. 0 = emulated only
WiperDraw=0          ; 1 = the plugin draws its own wipers (arm + rubber blade) along the pose
HideGameWipers=0     ; 1 = the car's own wiper blades are not drawn (use together with WiperDraw=1, otherwise there are no visible wipers). Needs a locked blade
WiperMeasure=1       ; 1 = the plugin reads the blade mesh's vertices once (log: "WiperHunt: blade N measured") and takes its direction and length from it; WiperAxis and
                     ; WiperLenM below are then only the fallback. The swept area is always taken from the blade's real two end points on the glass
WiperInner=0.25      ; where the rubber starts, as a fraction of the way out from the pivot (the rest of the arm does not wipe)
WiperAxis=0          ; which axis of the blade model points along the blade (0, 1 or 2). If the debug line points the wrong way, try the others
WiperAxisSign=1      ; -1 flips that axis
WiperLenM=0.5        ; blade length in metres (model units)
WiperDebug=0         ; 1 = draw the pose the plugin is using (magenta = blade 1, cyan = blade 2) so you can check it against the real blade
WiperAuto=1          ; emulated blades only: they run while it rains or snows. 0 = always
WiperPeriod=1.4      ; emulated blades only: seconds for one full up-and-back stroke
WiperPause=0.0       ; emulated blades only: seconds of rest between strokes
WiperSyncKey=118     ; emulated blades only: Ctrl + this key (118 = F7) when the real wiper starts moving up
; Emulated blade 1 and 2 (fallback): pivot X / Y as a fraction of the screen width / height, length as a fraction of the screen height, angles in degrees (0 = right, 90 = up). Len=0 = off.
W1X=0.30
W1Y=1.00
W1Len=0.70
W1A0=5
W1A1=100
W2X=0.60
W2Y=1.00
W2Len=0
W2A0=5
W2A1=100
; ---- keys and diagnostics
ToggleKey=119        ; virtual-key code, 119 = F8 (0 = disabled); needs Ctrl like the other hot keys
                     ; in the game's memory ("WiperScan candidate" lines, every 6 s). Run it on a rain stage with the wipers going. Leave 0 normally

[WindscreenStages]   ; OPTIONAL per-stage override of the rain level. Normally not needed: with RainSource=1 the game's own weather is used.
; Format:  <map id>=<rain 0..1>[,<mud multiplier>]      e.g.  12=0.9   or   7=0.3,2.0   (0 = dry)
; The map id is in the log: "StageStarted: map id=NN | game conditions: sky=... surfaceWetness=...". Ctrl+F9 reloads this list.
;12=0.9
