name: Build and release ForceFX

on:
  push:
    tags:
      - 'v*'       # runs when you push a tag like v1.0.0
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # needed to create the release and upload the zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile 32-bit DLL
        run: |
          cl /O2 /MT /EHsc /LD RBR_ForceFX.cpp /link /DEF:RBR_ForceFX.def dinput8.lib dxguid.lib user32.lib ws2_32.lib /OUT:RBR_ForceFX.dll

      - name: Prepare Release Package
        shell: pwsh
        run: |
          # Use the tag name (for example v0.2.0) in the zip's file name
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag) { $tag = "v0.0.0-dev" }
          
          $zipName = "ForceFX-$tag.zip"
          Write-Host "Creating archive: $zipName"

          # Gather the files that go in the release
          mkdir release_stage
          copy RBR_ForceFX.dll release_stage\
          copy ForceFX.ini release_stage\
          copy ForceFXCars.ini release_stage\
          
          # Zip them up
          Compress-Archive -Path release_stage\* -DestinationPath $zipName
          
          # Pass the zip's name on to the release step
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release and Upload Zip
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
