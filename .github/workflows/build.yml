name: Build and release ForceFX

on:
  push:
    branches:
      - memory     # runs automatically on every commit to the memory branch
    tags:
      - 'v*'       # runs when you push a tag like v1.0.0
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # needed to create the release and upload the zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile 32-bit DLL
        run: |
          cl /O2 /MT /EHsc /LD RBR_ForceFX.cpp /link /DEF:RBR_ForceFX.def dinput8.lib dxguid.lib user32.lib ws2_32.lib /OUT:RBR_ForceFX.dll

      - name: Prepare Release Package
        shell: pwsh
        run: |
          # Use the tag or branch name (for example v0.2.0 or memory) in the zip's file name
          $ref = $env:GITHUB_REF_NAME
          if (-not $ref) { $ref = "v0.0.0-dev" }
          
          # Append short commit SHA when building from a branch rather than a version tag
          if ($env:GITHUB_REF -notlike "refs/tags/*") {
            $shortSha = $env:GITHUB_SHA.Substring(0, 7)
            $zipName = "ForceFX-$ref-$shortSha.zip"
          } else {
            $zipName = "ForceFX-$ref.zip"
          }
          Write-Host "Creating archive: $zipName"

          # Gather the files that go in the release
          mkdir release_stage
          copy RBR_ForceFX.dll release_stage\
          copy ForceFX.ini release_stage\
          copy ForceFXCars.ini release_stage\
          
          # Zip them up
          Compress-Archive -Path release_stage\* -DestinationPath $zipName
          
          # Pass the zip's name on to the upload and release steps
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Create GitHub Release and Upload Zip
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
