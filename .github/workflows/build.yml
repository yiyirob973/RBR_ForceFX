name: Build and release ForceFX

on:
  push:
    branches:
      - audio
    tags:
      - 'v*'       # runs when you push a tag like v1.0.0
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # needed to create the release and upload the zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile 32-bit DLL (with audio module)
        run: |
          mkdir build_audio
          cl /std:c++17 /O2 /MT /EHsc /LD /DFORCEFX_AUDIO /Fo:build_audio\ RBR_ForceFX.cpp /link /DEF:RBR_ForceFX.def dinput8.lib dxguid.lib user32.lib ws2_32.lib winmm.lib /OUT:build_audio\RBR_ForceFX.dll

      - name: Compile 32-bit DLL (without audio module)
        run: |
          mkdir build_noaudio
          cl /std:c++17 /O2 /MT /EHsc /LD /Fo:build_noaudio\ RBR_ForceFX.cpp /link /DEF:RBR_ForceFX.def dinput8.lib dxguid.lib user32.lib ws2_32.lib /OUT:build_noaudio\RBR_ForceFX.dll

      - name: Prepare Release Packages
        shell: pwsh
        run: |
          # Use the tag name (for example v0.2.0) in the zip file names
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag) { $tag = "v0.0.0-dev" }
          $tag = $tag -replace '[\\/]', '-'

          $audioZip   = "ForceFX-$tag.zip"
          $noAudioZip = "ForceFX-$tag-NoAudio.zip"

          # With audio: DLL, settings files, and the sound-copy script in Plugins\ForceFXAudio
          mkdir stage_audio
          copy build_audio\RBR_ForceFX.dll stage_audio\
          copy ForceFX.ini stage_audio\
          copy ForceFXCars.ini stage_audio\
          copy ForceFXAudio.ini stage_audio\
          mkdir stage_audio\ForceFXAudio
          copy audio\tools\* stage_audio\ForceFXAudio\
          Compress-Archive -Path stage_audio\* -DestinationPath $audioZip

          # Without audio: DLL and the force-feedback settings only
          mkdir stage_noaudio
          copy build_noaudio\RBR_ForceFX.dll stage_noaudio\
          copy ForceFX.ini stage_noaudio\
          copy ForceFXCars.ini stage_noaudio\
          Compress-Archive -Path stage_noaudio\* -DestinationPath $noAudioZip

          echo "ZIP_AUDIO=$audioZip" >> $env:GITHUB_ENV
          echo "ZIP_NOAUDIO=$noAudioZip" >> $env:GITHUB_ENV

      - name: Upload build artifact (branch builds)
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ForceFX-builds
          path: |
            ${{ env.ZIP_AUDIO }}
            ${{ env.ZIP_NOAUDIO }}

      - name: Create GitHub Release and Upload Zip
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.ZIP_AUDIO }}
            ${{ env.ZIP_NOAUDIO }}
          generate_release_notes: true
