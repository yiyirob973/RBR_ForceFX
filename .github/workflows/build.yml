name: Build and Release ForceFX

on:
  push:
    tags:
      - 'v*'       # Triggered automatically when you push a tag like v1.0.0
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab if needed

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # Required to create a GitHub Release and upload assets

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile 32-bit DLL
        run: |
          cl /O2 /MT /EHsc /LD RBR_ForceFX.cpp /link /DEF:RBR_ForceFX.def dinput8.lib dxguid.lib user32.lib ws2_32.lib /OUT:RBR_ForceFX.dll

      - name: Prepare Release Package
        shell: pwsh
        run: |
          # Extract version from GitHub ref (e.g., refs/tags/v0.2.0 -> v0.2.0)
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag) { $tag = "v0.0.0-dev" }
          
          $zipName = "ForceFX-$tag.zip"
          Write-Host "Creating archive: $zipName"

          # Create a staging folder for the distribution package
          mkdir release_stage
          copy RBR_ForceFX.dll release_stage\
          copy ForceFX.ini release_stage\
          copy ForceFXCars.ini release_stage\
          
          # Compress contents into a dynamically named zip archive
          Compress-Archive -Path release_stage\* -DestinationPath $zipName
          
          # Save the filename as an environment variable for the release step
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release and Upload Zip
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
