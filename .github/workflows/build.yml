name: Build and release ForceFX

on:
  push:
    branches:
      - main
    tags:
      - 'v*'       # runs when you push a tag like v1.0.0
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # needed to create the release and upload the zips

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Set the version shown in the game
        # A tag build shows the tag (for example v0.7.0). Any other build leaves FORCEFX_VERSION unset, so the plugin says
        # "Dev build" and the date it was compiled.
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-'
          "FORCEFX_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile the 32-bit DLL (build.bat)
        shell: cmd
        run: build.bat

      - name: Prepare release package
        shell: pwsh
        run: |
          # Use the tag name (for example v0.7.0) in the zip file name
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag) { $tag = "v0.0.0-dev" }
          $tag = $tag -replace '[\\/]', '-'

          $stage = "stage"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item out\RBR_ForceFX.dll $stage
          Copy-Item ForceFX.ini, ForceFXCars.ini $stage
          New-Item -ItemType Directory -Path "$stage\ForceFXAudio" | Out-Null
          Copy-Item audio\tools\* "$stage\ForceFXAudio"
          $zip = "ForceFX-$tag.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact (branch builds)
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ForceFX-builds
          path: ${{ env.ZIP }}

      - name: Create GitHub Release and Upload Zips
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
