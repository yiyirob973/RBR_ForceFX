; TrueforceCars.ini - per-car profiles for RBR_TrueforcePlugin
;
; HOW CARS ARE MATCHED (nothing to configure):
;   The plugin reads the car's name text the same way RSF does: rallysimfans.ini [cars] slot, then
;   Cars\Cars.ini [Car0<slot>] CarName / RSFCarID. That name is compared with every Name= below, loosely:
;   case, punctuation, "Grp"/"Group" spelling and missing manufacturer words do not matter, but years and
;   model numbers must agree ("Escort Cosworth GrA" finds "Ford Escort RS Cosworth GrpA").
;   Section names do not matter; every section with a Name= is a profile. The file is re-read when it changes,
;   and the menu page plus TrueforceRumble.log show which profile each car matched.
;   Cars without a matching profile use the [Trueforce] values from TrueforceRumble.ini unchanged.
;
; Keys (all optional except Name; anything not set falls back to TrueforceRumble.ini):
;   Name         the car's name; matched against the game's name text
;   Match        extra names that should also match, comma separated
;   RSFCarID     exact RSF car id (strongest match, optional)
;   Preset       inline4 | inline4turbo | boxer4 | inline5 | v6 | flat6 | v8
;   Cylinders    overrides the preset
;   RpmMax       the car's rev limit (otherwise learned while driving)
;   EngineScale  multiplies EngineMaxMagnitude for this car (0..2)
;   RoadScale    multiplies RoadMaxMagnitude for this car (0..2)
;   LumpScale    idle lump / beating strength (0..2)
;   Grit         high-rev roughness (0..1)
;   Unevenness   uneven firing: amplitude sway at half engine order (0..1)
;   WeightFeel   0.5..2: heavier = stronger landing thump, slower decay, lower road pitch
;

