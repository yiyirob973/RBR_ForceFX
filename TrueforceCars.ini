; TrueforceCars.ini - per-car profiles for RBR_TrueforcePlugin.
; One section per NGP Car.Index. The current index is shown on the plugin's menu page and written to
; TrueforceRumble.log when a car is first seen. Cars without a section use the [Trueforce] values unchanged.
;
; Keys (all optional; anything not set falls back to TrueforceRumble.ini):
;   Name         label shown in the menu
;   Preset       inline4 | inline4turbo | boxer4 | inline5 | v6 | flat6 | v8   (sets cylinders and engine character)
;   Cylinders    overrides the preset
;   RpmMax       the car's rev limit (otherwise learned while driving)
;   EngineScale  multiplies EngineMaxMagnitude for this car (0..2)
;   RoadScale    multiplies RoadMaxMagnitude for this car (0..2)
;   LumpScale    idle lump / beating strength (0..2)
;   Grit         high-rev roughness (0..1)
;   Unevenness   uneven firing: amplitude sway at half engine order (0..1)
;   WeightFeel   0.5..2: heavier = stronger landing thump, slower decay, lower road pitch
;
; Examples (remove the leading semicolons and set the index of your car):
;
; [Car3]
; Name=Subaru Impreza
; Preset=boxer4
; RpmMax=7800
; WeightFeel=1.1
;
; [Car5]
; Name=Audi Quattro S1
; Preset=inline5
; WeightFeel=1.2
;
; [Car1]
; Name=Light front-wheel-drive hatch
; Preset=inline4
; WeightFeel=0.8
