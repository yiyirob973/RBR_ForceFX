; ForceFXCars.ini - per-car profiles for RBR_ForceFX
;
; How cars are matched (there is nothing to configure):
;   ForceFX reads the car's name the same way RSF does, from the [cars] slot in rallysimfans.ini and then
;   Cars\Cars.ini [Car0<slot>] CarName / RSFCarID. That name is compared with every Name= below. The match is
;   forgiving: case, punctuation, "Grp" vs "Group" and missing manufacturer words don't matter, but years and
;   model numbers must agree ("Escort Cosworth GrA" finds "Ford Escort RS Cosworth GrpA").
;   Section names don't matter. Every section with a Name= is a profile. The file is re-read whenever it
;   changes, and the in-game menu and ForceFX.log both show which profile the current car matched.
;   Cars without a matching profile simply use the [ForceFX] values from ForceFX.ini.
;
; Keys (everything except Name is optional; anything you leave out falls back to ForceFX.ini):
;   Name         the car's name, matched against the name the game reports
;   Match        extra names that should also match this profile, separated by commas
;   RSFCarID     the exact RSF car id (the strongest kind of match)
;   Preset       inline4 | inline4turbo | boxer4 | inline5 | v6 | flat6 | v8
;   Cylinders    overrides the preset's cylinder count
;   RpmMax       the car's rev limit (otherwise it is learned while you drive)
;   EngineScale  multiplies EngineMaxMagnitude for this car (0..2)
;   RoadScale    multiplies RoadMaxMagnitude for this car (0..2)
;   LumpScale    strength of the idle lump and beating (0..2)
;   Grit         high-rev roughness (0..1)
;   Unevenness   uneven firing: the strength sways at half engine order (0..1)
;   WeightFeel   0.5..2. Heavier means a stronger landing thump, slower decay and lower road pitch
;

